<style>
  :root {
    --white: #fff;
    --font-color: #5A3E2B;
    --main-color: #F5EBDD;
    --sub-color: #A89484;
    --ac-color: #E8B4B8;
  }

  * {
    box-sizing: border-box;
  }

  html {
    font-size: 16px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "M PLUS Rounded 1c", "Zen Maru Gothic", sans-serif;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--sub-color);
    background: var(--main-color);
  }

  .error-page {
    width: 100%;
    padding: 2.5rem 1.5rem;
    text-align: center;
  }

  .error-page__logo {
    display: inline-block;
    width: 6.75rem;
  }

  .error-page__logo img {
    display: block;
    width: 100%;
    height: auto;
  }

  .error-page__code {
    margin-top: 3.75rem;
    font-size: 5rem;
    line-height: 1;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    color: var(--sub-color);
  }

  .error-page__text {
    margin: 0.75rem auto 0;
    max-width: 26rem;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.8;
  }

  .error-page__button {
    margin-top: 2.5rem;
  }

  .error-page__button .button {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 1.25rem 2.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1;
    color: var(--white);
    background: linear-gradient(to top, rgba(255,255,255,0.15), transparent), var(--ac-color);
    border: 0.08em solid transparent;
    border-radius: 5em;
    cursor: pointer;
    transition: color .3s ease, background-color .3s ease;
  }

  .error-page__button .button span {
    width: 2.5rem;
    height: 0.6em;
    border-bottom: 0.16em solid currentColor;
    border-right: 0.16em solid currentColor;
    transform: translateY(-50%) skew(45deg);
    transform-origin: center;
  }

  @media (hover: hover) {
    .error-page__button .button:hover {
      color: var(--ac-color);
      background: var(--white);
    }
  }

  @media (min-width: 768px) {
    .error-page__code {
      margin-top: 5.25rem;
      font-size: 8rem;
    }

    .error-page__text {
      margin-top: 2.5rem;
    }

    .error-page__button {
      margin-top: 5rem;
    }
  }
</style>
